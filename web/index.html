<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Agente de contratos · Periferia</title>
<style>
  :root { --bg:#f6f7f9; --panel:#fff; --line:#e3e6ea; --txt:#1d2430; --muted:#6b7380; --brand:#14532d; --brand-2:#e8f5ec; --warn:#92400e; --warn-bg:#fef3c7; --err:#991b1b; --err-bg:#fee2e2; }
  * { box-sizing: border-box; }
  body { margin:0; font:15px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif; background:var(--bg); color:var(--txt); height:100vh; display:flex; flex-direction:column; }
  header { background:var(--panel); border-bottom:1px solid var(--line); padding:12px 20px; display:flex; align-items:center; gap:12px; }
  header h1 { font-size:16px; margin:0; } header .meta { color:var(--muted); font-size:13px; margin-left:auto; }
  button { font:inherit; border:1px solid var(--line); background:var(--panel); border-radius:8px; padding:6px 12px; cursor:pointer; }
  button.primary { background:var(--brand); color:#fff; border-color:var(--brand); } button:disabled { opacity:.5; cursor:default; }
  #chat { flex:1; overflow-y:auto; padding:20px; display:flex; flex-direction:column; gap:14px; max-width:980px; width:100%; margin:0 auto; }
  .msg { padding:12px 16px; border-radius:12px; max-width:100%; overflow-x:auto; }
  .usuario { align-self:flex-end; background:var(--brand); color:#fff; max-width:75%; white-space:pre-wrap; }
  .agente { align-self:flex-start; background:var(--panel); border:1px solid var(--line); width:100%; }
  .agente.confirmar { border:2px solid #d97706; box-shadow:0 0 0 4px var(--warn-bg); }
  .banner { background:var(--warn-bg); color:var(--warn); font-weight:600; padding:8px 12px; border-radius:8px; margin-bottom:10px; }
  .error { background:var(--err-bg); color:var(--err); padding:8px 12px; border-radius:8px; margin-top:8px; }
  details.tool { border:1px solid var(--line); border-radius:8px; margin:6px 0; background:#fafbfc; font-size:13px; }
  details.tool summary { padding:6px 10px; cursor:pointer; display:flex; gap:8px; align-items:center; }
  details.tool .nombre { font-family:ui-monospace,monospace; font-weight:600; }
  details.tool .ok { color:var(--brand); } details.tool .ko { color:var(--err); }
  details.tool pre { margin:0; padding:8px 10px; border-top:1px solid var(--line); max-height:280px; overflow:auto; font-size:12px; }
  .tools-label { color:var(--muted); font-size:12px; text-transform:uppercase; letter-spacing:.04em; margin-bottom:4px; }
  .md table { border-collapse:collapse; margin:8px 0; font-size:14px; } .md th,.md td { border:1px solid var(--line); padding:4px 8px; text-align:left; } .md th { background:var(--brand-2); }
  .md h1,.md h2,.md h3 { font-size:15px; margin:12px 0 6px; } .md p { margin:6px 0; } .md code { background:#f1f3f5; padding:1px 4px; border-radius:4px; }
  .pensando { color:var(--muted); font-style:italic; }
  footer { background:var(--panel); border-top:1px solid var(--line); padding:12px 20px; }
  .wrap { max-width:980px; margin:0 auto; } .sugerencias { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:8px; } .sugerencias button { font-size:13px; }
  form { display:flex; gap:8px; } textarea { flex:1; font:inherit; padding:10px; border:1px solid var(--line); border-radius:8px; resize:none; height:64px; }
</style>
</head>
<body>
<header>
  <h1>Agente de registro de contratos</h1>
  <span class="meta" id="meta">…</span>
  <button id="nueva" title="Nueva conversación">Nueva sesión</button>
  <button id="reset" title="Borra out/ y todas las sesiones">Reiniciar datos</button>
</header>
<main id="chat"></main>
<footer><div class="wrap">
  <div class="sugerencias">
    <button data-p="Procesa el buzón de contratos con fecha de hoy 2026-09-03. Registra lo que esté limpio, muéstrame lo que requiere revisión campo por campo y termina con el reporte de alertas. No registres nada dudoso sin preguntarme.">▶ Procesar buzón (PRD)</button>
    <button data-p="Confirmo el valor 0 y la fecha fin 2027-08-31 para msg-006.">✔ Confirmar msg-006</button>
    <button data-p="¿Qué contratos vencen en los próximos 60 días y qué pólizas están pendientes? Usa fecha 2026-09-03.">⚠ Alertas</button>
  </div>
  <form id="form"><textarea id="entrada" placeholder="Escribe un mensaje… (Enter para enviar, Shift+Enter nueva línea)"></textarea><button class="primary" id="enviar">Enviar</button></form>
</div></footer>
<script>
const $ = (s) => document.querySelector(s)
const chat = $("#chat"), entrada = $("#entrada"), enviarBtn = $("#enviar")
let sesion = localStorage.getItem("sesion") || nuevaSesion()
let clave = localStorage.getItem("clave") || ""

function nuevaSesion() { const id = "s-" + crypto.randomUUID().slice(0, 8); localStorage.setItem("sesion", id); return id }
const esc = (t) => String(t ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c])

// Markdown mínimo: tablas, títulos, listas, negrita, código.
function md(texto) {
  const lineas = esc(texto).split("\n"), out = []
  for (let i = 0; i < lineas.length; i++) {
    const l = lineas[i]
    if (/^\s*\|/.test(l) && /^\s*\|[\s:-]+\|/.test(lineas[i + 1] || "")) {
      const celdas = (x) => x.trim().replace(/^\||\|$/g, "").split("|").map((c) => inline(c.trim()))
      let h = "<table><tr>" + celdas(l).map((c) => `<th>${c}</th>`).join("") + "</tr>"; i++
      while (/^\s*\|/.test(lineas[i + 1] || "")) h += "<tr>" + celdas(lineas[++i]).map((c) => `<td>${c}</td>`).join("") + "</tr>"
      out.push(h + "</table>")
    } else if (/^#{1,4} /.test(l)) out.push(`<h3>${inline(l.replace(/^#+ /, ""))}</h3>`)
    else if (/^\s*[-*] /.test(l)) out.push(`<div>• ${inline(l.replace(/^\s*[-*] /, ""))}</div>`)
    else if (l.trim()) out.push(`<p>${inline(l)}</p>`)
  }
  return out.join("")
}
const inline = (t) => t.replace(/\*\*(.+?)\*\*/g, "<b>$1</b>").replace(/`([^`]+)`/g, "<code>$1</code>")

function pintarUsuario(texto) { const d = document.createElement("div"); d.className = "msg usuario"; d.textContent = texto; chat.append(d); bajar() }
function pintarAgente(r) {
  const d = document.createElement("div"); d.className = "msg agente" + (r.needsConfirmation ? " confirmar" : "")
  let h = r.needsConfirmation ? `<div class="banner">⏸ El agente espera tu confirmación antes de registrar</div>` : ""
  if (r.toolCalls?.length) {
    h += `<div class="tools-label">Herramientas usadas (${r.toolCalls.length})</div>`
    h += r.toolCalls.map((t) => `<details class="tool"><summary><span class="${t.ok ? "ok" : "ko"}">${t.ok ? "✓" : "✗"}</span><span class="nombre">${esc(t.nombre)}</span><span>${esc(t.resumen)}</span></summary><pre>args: ${esc(JSON.stringify(t.args, null, 2))}\n\nresultado: ${esc(JSON.stringify(t.resultado, null, 2))}</pre></details>`).join("")
  }
  h += `<div class="md">${md(r.reply || r.texto || "")}</div>`
  if (r.error) h += `<div class="error">${esc(r.error)}</div>`
  d.innerHTML = h; chat.append(d); bajar()
}
const bajar = () => (chat.scrollTop = chat.scrollHeight)

async function api(ruta, opciones = {}) {
  const res = await fetch(ruta, { ...opciones, headers: { "content-type": "application/json", "x-access-key": clave, ...(opciones.headers || {}) } })
  if (res.status === 401) { clave = prompt("Clave de acceso:") || ""; localStorage.setItem("clave", clave); return api(ruta, opciones) }
  return res.json()
}

async function enviar(texto) {
  if (!texto.trim()) return
  pintarUsuario(texto); entrada.value = ""; enviarBtn.disabled = true
  const p = document.createElement("div"); p.className = "msg agente pensando"; p.textContent = "El agente está pensando y usando herramientas…"; chat.append(p); bajar()
  try { pintarAgente(await api("/api/chat", { method: "POST", body: JSON.stringify({ sessionId: sesion, message: texto }) })) }
  catch { pintarAgente({ reply: "", error: "No hay conexión con el servidor." }) }
  finally { p.remove(); enviarBtn.disabled = false; entrada.focus() }
}

async function cargar() {
  const h = await fetch("/api/health").then((r) => r.json()).catch(() => null)
  $("#meta").textContent = h ? `${h.provider} · ${h.model}${h.llm_configurado ? "" : " · ⚠ sin clave"} · sesión ${sesion}` : "servidor no disponible"
  chat.innerHTML = ""
  const s = await api(`/api/sessions/${sesion}`).catch(() => null)
  for (const e of s?.chat || []) e.rol === "usuario" ? pintarUsuario(e.texto) : pintarAgente(e)
}

$("#form").onsubmit = (e) => { e.preventDefault(); enviar(entrada.value) }
entrada.onkeydown = (e) => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); enviar(entrada.value) } }
document.querySelectorAll("[data-p]").forEach((b) => (b.onclick = () => enviar(b.dataset.p)))
$("#nueva").onclick = () => { sesion = nuevaSesion(); cargar() }
$("#reset").onclick = async () => { if (confirm("¿Borrar maestro, historial y sesiones para repetir la demo?")) { await api("/api/reset", { method: "POST" }); sesion = nuevaSesion(); cargar() } }
cargar()
</script>
</body>
</html>
