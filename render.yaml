# Blueprint de Render: New → Blueprint → seleccionar este repositorio.
services:
  - type: web
    name: agente-contratos
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false # se ingresa en el panel de Render, nunca en el repositorio
      - key: LLM_MODEL
        value: claude-opus-5-5
      - key: FECHA_HOY
        value: "2026-09-03"
      - key: ACCESS_KEY
        sync: false
